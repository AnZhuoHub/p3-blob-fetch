name: fetch-p3-adreno

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 1. 解析 Pixel3 blueline factory image 直链
        run: |
          set -e
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          curl -sL --compressed -A "$UA" "https://developers.google.com/android/images?hl=en" -o imgs.html || true
          grep -oE 'https://dl\.google\.com/dl/android/aosp/blueline-[a-z0-9._]+-factory-[0-9a-f]+\.zip' imgs.html | sort -u > urls.txt || true
          echo "页面解析到条数: $(wc -l < urls.txt)"

          URL=$(grep -E 'blueline-sp2a' urls.txt | head -1 || true)
          if [ -z "$URL" ]; then URL=$(grep -E 'blueline-sp1a' urls.txt | head -1 || true); fi

          if [ -z "$URL" ]; then
            echo "页面解析为空 -> 用候选直链探测"
            for c in \
              "https://dl.google.com/dl/android/aosp/blueline-sp1a.210812.016.a2-factory-0e1330df.zip" ; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -I -A "$UA" "$c" || echo 000)
              echo "  $code  $c"
              if [ "$code" = "200" ]; then URL="$c"; break; fi
            done
          fi
          if [ -z "$URL" ]; then echo "!! 无可用直链"; exit 1; fi
          echo "选中: $URL"
          echo "FAC_URL=$URL" >> $GITHUB_ENV

      - name: 2. 下载 factory 包
        run: |
          curl -L --retry 5 --retry-delay 3 -o fac.zip "$FAC_URL"
          ls -lh fac.zip

      - name: 3. 解出 vendor.img 并转 raw
        run: |
          set -e
          unzip -q fac.zip -d fac
          IMG=$(find fac -name 'image-blueline-*.zip' | head -1)
          echo "image zip: $IMG"
          unzip -q -o "$IMG" vendor.img -d fac
          file fac/vendor.img
          if file fac/vendor.img | grep -qi 'android sparse'; then
            echo "sparse -> raw"
            sudo apt-get update -qq
            sudo apt-get install -y -qq android-sdk-libsparse-utils
            simg2img fac/vendor.img fac/vendor.raw.img
          else
            cp fac/vendor.img fac/vendor.raw.img
          fi
          ls -lh fac/vendor.raw.img
          file fac/vendor.raw.img

      - name: 4. 从 ext4 直接 dump Adreno 用户态驱动
        run: |
          set -e
          mkdir -p out
          for f in \
            lib64/egl/libEGL_adreno.so \
            lib64/egl/libGLESv1_CM_adreno.so \
            lib64/egl/libGLESv2_adreno.so \
            lib64/egl/libq3dtools_adreno.so \
            lib64/libgsl.so \
            lib64/libadreno_utils.so \
            lib64/libCB.so \
            lib64/libllvm-glnext.so \
            lib64/librs_adreno.so \
            lib64/libRSDriver_adreno.so ; do
            n=$(basename "$f")
            rm -f "out/$n"
            debugfs -R "dump /$f out/$n" fac/vendor.raw.img >/dev/null 2>&1 || true
            if [ -s "out/$n" ]; then
              echo "OK   $n  $(stat -c%s "out/$n")"
            else
              echo "MISS $f"
            fi
          done
          echo "--- 总计 ---"
          du -sh out
          sha256sum out/* | tee out.sha256

      - name: 5. 验证版本串 + 打包 + 1MB 切块
        run: |
          set -e
          echo "驱动版本串:"
          grep -aoE 'V@[0-9]{3,4}\.[0-9][^)]*\)' out/libGLESv2_adreno.so | head -3
          tar -C out -czf p3blob.tar.gz .
          ls -lh p3blob.tar.gz
          sha256sum p3blob.tar.gz | tee p3blob.tar.gz.sha256
          rm -rf parts && mkdir -p parts
          split -b 1M -d -a 4 p3blob.tar.gz parts/p3blob.tar.gz.
          echo "块数: $(ls parts | wc -l)"

      - name: 6. 推分块到私有仓库
        env:
          STORE_TOKEN: ${{ secrets.STORE_TOKEN }}
        run: |
          set -e
          git config --global user.name "p3-blob-bot"
          git config --global user.email "bot@localhost"
          git clone "https://x-access-token:${STORE_TOKEN}@github.com/AnZhuoHub/p3-blob-store.git" store
          cd store
          git checkout -B main
          rm -rf parts imgs.html
          mkdir -p parts
          cp ../parts/* parts/
          cp ../p3blob.tar.gz.sha256 ./p3blob.tar.gz.sha256
          cp ../out.sha256 ./out.sha256
          echo "FAC_URL=${FAC_URL}" > source.txt
          date -u >> source.txt
          git add -A
          git commit -m "blueline adreno blobs $(date -u +%Y%m%d-%H%M)" || echo "nothing to commit"
          git push origin HEAD:main
          echo "== 推送完成 =="
